name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  ZIZMOR_VERSION: 1.30.0
  ACTIONLINT_VERSION: v1.7.12

jobs:
  actions:
    name: Composite actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor and bats
        run: |
          pipx install "zizmor==$ZIZMOR_VERSION"
          sudo apt-get install -y --no-install-recommends bats

      - name: zizmor (actions/ and this repo's workflows)
        run: zizmor --no-progress --format github actions .github/workflows

      - name: shellcheck
        run: |
          find actions -type f \( -name '*.sh' -o -path '*/test/stubs/*' \) -print0 | xargs -0 -r shellcheck

      - name: bats
        run: |
          find actions -name '*.bats' -print0 | xargs -0 -r bats

  seed:
    name: Seed templates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install actionlint and zizmor
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          pipx install "zizmor==$ZIZMOR_VERSION"

      - name: Render seed/ with fixture values
        run: hack/render-seed.sh .rendered

      - name: actionlint (rendered workflow templates)
        # A .git marker makes actionlint treat the rendered tree as the project, so
        # `uses: ./.github/workflows/<reusable>.yml` resolves against the seed's own files.
        run: |
          git init -q .rendered
          cd .rendered && actionlint

      - name: zizmor (rendered workflow templates)
        run: zizmor --no-progress --format github --config hack/zizmor-seed.yml --min-severity high .rendered/.github/workflows

      - name: shellcheck (rendered scripts)
        run: find .rendered/scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

  rust-scaffold:
    # seed/rust/ is the one scaffold that is a complete crate (AGENTS.md), so it is
    # the one that can be compiled before it merges: the rendered workspace must
    # pass the same gate `make rs-check` applies in a seeded repo, minus the
    # generator-dependent drift check. The lockfile is generated here because the
    # seed ships none (the crate name is a placeholder until rendering).
    name: Rendered Rust scaffold
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render seed/ with fixture values
        run: hack/render-seed.sh .rendered

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: '1.98.1'
          components: clippy, rustfmt

      - name: Install cargo-deny
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-deny@0.20.2

      - name: fmt, clippy, test, doc, deny, publish dry-run
        working-directory: .rendered/rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo generate-lockfile
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo build -p fizzy-sdk --no-default-features --locked
          cargo test -p fizzy-sdk --no-default-features --lib --locked
          cargo build -p fizzy-sdk --examples --locked
          cargo doc --no-deps --all-features -p fizzy-sdk --locked
          cargo deny --locked check
          cargo publish -p fizzy-sdk --dry-run --locked --allow-dirty
