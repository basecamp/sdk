# zizmor policy for the rendered seed templates (hack/render-seed.sh output), used
# by .github/workflows/ci.yml. The repo's own workflows and actions/ run under the
# default policy; only the templates carry these baseline exceptions, which exist
# because the templates predate the SHA-pinned, zizmor-clean release workflows in
# basecamp-sdk. Each entry should go when the template it names is re-extracted
# from there. Anything not listed keeps zizmor's default hash-pin policy, so a
# new dependency cannot ride in on a floating ref.
rules:
  unpinned-uses:
    config:
      policies:
        "actions/*": ref-pin
        "github/*": ref-pin
        # the seed's own composite actions, tracked at @main by convention
        basecamp/sdk/actions/conformance-run: ref-pin
        basecamp/sdk/actions/release-orchestrate: ref-pin
        basecamp/sdk/actions/rubric-check: ref-pin
        basecamp/sdk/actions/smithy-verify: ref-pin
        ruby/setup-ruby: ref-pin
        gradle/actions/setup-gradle: ref-pin
        rubygems/configure-rubygems-credentials: ref-pin
  cache-poisoning:
    ignore:
      - release-go.yml
      - release-kotlin.yml
      - release-ruby.yml
      - release-typescript.yml
  excessive-permissions:
    ignore:
      - release-kotlin.yml
      - release-ruby.yml
      - release-typescript.yml
