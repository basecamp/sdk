name: Service Drift
description: Detects drift between generated service layer and OpenAPI spec

inputs:
  language:
    description: Language to check for drift (go, typescript, ruby, kotlin, swift, rust)
    required: true

outputs:
  drifted:
    description: Whether drift was detected
    value: ${{ steps.check.outputs.drifted }}
  report:
    description: Drift report details
    value: ${{ steps.check.outputs.report }}

runs:
  using: composite
  steps:
    - name: Check service drift
      id: check
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
      run: |
        # Language names are spelled out here; Makefile targets use the short
        # prefixes from MAKEFILE-CONVENTION.md (go, ts, rb, swift, kt, rs).
        case "$LANGUAGE" in
          go)         target=go-generate-services ;;
          typescript) target=ts-generate-services ;;
          ruby)       target=rb-generate-services ;;
          kotlin)     target=kt-generate-services ;;
          swift)      target=swift-generate-services ;;
          rust)       target=rs-generate-services ;;
          *)
            echo "::error::Unsupported language: $LANGUAGE"
            exit 1
            ;;
        esac

        make "$target"

        if git diff --quiet; then
          drifted=false
        else
          drifted=true
        fi

        echo "drifted=$drifted" >> "$GITHUB_OUTPUT"

        if [ "$drifted" = true ]; then
          echo "report=Service layer for $LANGUAGE has drifted from OpenAPI spec" >> "$GITHUB_OUTPUT"
          echo "::warning::Service drift detected for $LANGUAGE. Run 'make $target'"
        else
          echo "report=No drift detected for $LANGUAGE" >> "$GITHUB_OUTPUT"
          echo "No service drift for $LANGUAGE"
        fi
