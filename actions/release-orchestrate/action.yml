name: Release Orchestrate
description: >-
  Polls the push-triggered per-language release workflows for a tag and creates
  the GitHub Release when all succeed

inputs:
  version:
    description: Release version (e.g., 1.2.3)
    required: true
  github-token:
    description: GitHub token for API calls
    required: true
  languages:
    description: >-
      Comma-separated list of languages to wait for; each one needs a
      release-<lang>.yml workflow (e.g., go,typescript,ruby,kotlin,swift,rust)
    required: true
  poll-interval:
    description: Seconds between polls
    required: false
    default: '30'
  timeout:
    description: Maximum seconds to wait
    required: false
    default: '1800'

outputs:
  release-url:
    description: URL of the created GitHub Release
    value: ${{ steps.orchestrate.outputs.release-url }}
  status:
    description: Final status (success or partial-failure)
    value: ${{ steps.orchestrate.outputs.status }}

runs:
  using: composite
  steps:
    - name: Wait for release workflows
      id: orchestrate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ inputs.version }}
        LANGUAGES: ${{ inputs.languages }}
        POLL_INTERVAL: ${{ inputs.poll-interval }}
        TIMEOUT: ${{ inputs.timeout }}
      run: '"$GITHUB_ACTION_PATH/orchestrate.sh"'
