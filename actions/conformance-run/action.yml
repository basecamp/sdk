name: Conformance Run
description: Runs SDK conformance tests for a specific language

inputs:
  language:
    description: Language to run conformance tests for (go, typescript, ruby, swift, kotlin)
    required: true
  ruby-version:
    description: Ruby version for conformance runner (ignored for non-Ruby). Defaults to '3.3'.
    required: false
    default: '3.3'
  test-filter:
    description: Optional filter to run specific test files (e.g., retry,pagination)
    required: false
    default: ''

outputs:
  passed:
    description: Number of passing tests
    value: ${{ steps.run.outputs.passed }}
  failed:
    description: Number of failing tests
    value: ${{ steps.run.outputs.failed }}
  report:
    description: JSON test results report
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: Set up Go
      if: inputs.language == 'go'
      uses: actions/setup-go@v5
      with:
        go-version-file: go/go.mod

    - name: Set up Node
      if: inputs.language == 'typescript'
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Ruby
      if: inputs.language == 'ruby'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true
        working-directory: conformance/runner/ruby

    - name: Set up Java (for Kotlin)
      if: inputs.language == 'kotlin'
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle (for Kotlin)
      if: inputs.language == 'kotlin'
      uses: gradle/actions/setup-gradle@v5

    - name: Run conformance tests
      id: run
      shell: bash
      run: |
        exit_code=0

        case "${{ inputs.language }}" in
          go)
            cd conformance/runner/go
            go build -o conformance-runner .
            ./conformance-runner 2>&1 | tee /tmp/conformance-output.txt || exit_code=$?
            ;;
          typescript)
            cd conformance/runner/typescript
            npm ci --silent
            npm test 2>&1 | tee /tmp/conformance-output.txt || exit_code=$?
            ;;
          ruby)
            cd conformance/runner/ruby
            bundle install --quiet
            ruby runner.rb 2>&1 | tee /tmp/conformance-output.txt || exit_code=$?
            ;;
          swift)
            cd conformance/runner/swift
            swift build -c release 2>&1
            .build/release/ConformanceRunner 2>&1 | tee /tmp/conformance-output.txt || exit_code=$?
            ;;
          kotlin)
            cd conformance/runner/kotlin
            ./gradlew run 2>&1 | tee /tmp/conformance-output.txt || exit_code=$?
            ;;
          *)
            echo "::error::Unsupported language: ${{ inputs.language }}"
            exit 1
            ;;
        esac

        # Parse summary counts portably (no grep -P).
        # Go format:   "Passed: N, Failed: M, Total: T"
        # Ruby format: "Results: N passed, M failed, K skipped"
        # TS/vitest:   "Tests  N failed | M passed | K skipped (T)"
        passed=$(grep -o 'Passed: [0-9]*' /tmp/conformance-output.txt 2>/dev/null | tail -1 | grep -o '[0-9]*' || true)
        if [ -z "$passed" ]; then
          passed=$(grep -o '[0-9]* passed' /tmp/conformance-output.txt 2>/dev/null | tail -1 | grep -o '[0-9]*' || true)
        fi
        failed=$(grep -o 'Failed: [0-9]*' /tmp/conformance-output.txt 2>/dev/null | tail -1 | grep -o '[0-9]*' || true)
        if [ -z "$failed" ]; then
          failed=$(grep -o '[0-9]* failed' /tmp/conformance-output.txt 2>/dev/null | tail -1 | grep -o '[0-9]*' || true)
        fi
        : "${passed:=0}"
        : "${failed:=0}"

        echo "passed=$passed" >> "$GITHUB_OUTPUT"
        echo "failed=$failed" >> "$GITHUB_OUTPUT"
        echo "report=$(tail -20 /tmp/conformance-output.txt | jq -Rs .)" >> "$GITHUB_OUTPUT"

        echo "Conformance (${{ inputs.language }}): $passed passed, $failed failed (exit code: $exit_code)"

        # Trust the runner's exit code as the authoritative pass/fail signal
        if [ "$exit_code" -ne 0 ]; then
          echo "::error::Conformance tests failed for ${{ inputs.language }} (exit code $exit_code)"
          exit "$exit_code"
        fi
