name: Smithy Verify
description: Validates Smithy spec, builds OpenAPI, checks freshness

inputs:
  smithy-cli-version:
    description: Smithy CLI version to install
    required: false
    default: '1.49.0'

outputs:
  fresh:
    description: Whether openapi.json matches Smithy output
    value: ${{ steps.check.outputs.fresh }}

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: corretto
        java-version: '17'

    - name: Install Smithy CLI
      shell: bash
      env:
        SMITHY_CLI_VERSION: ${{ inputs.smithy-cli-version }}
      run: |
        mkdir -p "$RUNNER_TEMP/smithy"
        curl -sL "https://github.com/smithy-lang/smithy/releases/download/${SMITHY_CLI_VERSION}/smithy-cli-linux-x86_64.tar.gz" | tar xz -C "$RUNNER_TEMP/smithy"

    - name: Validate Smithy spec
      shell: bash
      run: cd spec && "$RUNNER_TEMP/smithy/smithy-cli/bin/smithy" validate

    - name: Build OpenAPI from Smithy
      shell: bash
      run: PATH="$RUNNER_TEMP/smithy/smithy-cli/bin:$PATH" make smithy-build

    - name: Check freshness
      id: check
      shell: bash
      run: |
        if git diff --quiet openapi.json; then
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          echo "openapi.json is up to date"
        else
          echo "fresh=false" >> "$GITHUB_OUTPUT"
          echo "::error::openapi.json is out of date. Run 'make smithy-build'"
          exit 1
        fi
